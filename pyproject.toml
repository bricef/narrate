[project]
name = "narrate"
version = "0.1.1"
description = "Local Markdown-to-video tool compatible with Narakeet's script format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brice Fernandes" }]
keywords = ["markdown", "video", "narration", "text-to-speech", "voice-over", "slides", "screencast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2",
    "kokoro-onnx>=0.4",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "pygments>=2.21.0",
    "pyyaml>=6",
    "starlette>=1.10.0",
    "uvicorn>=0.54",
]

[project.urls]
Homepage = "https://github.com/bricef/narrate"
Documentation = "https://github.com/bricef/narrate#documentation"
Issues = "https://github.com/bricef/narrate/issues"
Source = "https://github.com/bricef/narrate"

[project.scripts]
narrate = "narrate.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling>=1.32.4"]  # Dependabot keeps this current; narrate needs 1.27 or later, the first to write PEP 639 licence metadata by default
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live API tests spend credits: opt in with `just test -m elevenlabs`
addopts = "-m 'not elevenlabs'"
markers = [
    "kokoro: needs the Kokoro model files (slow; deselect with -m 'not kokoro')",
    "elevenlabs: calls the live ElevenLabs API with ELEVENLABS_API_KEY (spends a few credits)",
    "conformance: compares against Narakeet's renders (needs `just reference`; skip with -m 'not conformance')",
    "stt: transcribes speech with faster-whisper (downloads its model on first use)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Ruff's long-standing defaults (E4, E7, E9, F), which the code's noqa comments
# were written for, named so that a ruff update can't change them. Then checks
# the code already passes: whitespace and escapes (W), blocking calls in async
# code (ASYNC), leftover debuggers (T10), and noqa without a code (PGH).
select = ["E4", "E7", "E9", "F", "W", "ASYNC", "T10", "PGH"]
