name: Checks

# ruff, and the test suite on Linux and macOS without the tests that download
# models or call ElevenLabs: about 6 minutes on Linux and 10 to 14 on macOS,
# where image.yml takes 6 to 13. It runs on every pull request, forks included,
# since image.yml runs on pushes to this repository's branches.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Each job has its own uv cache: this one installs only the dev group
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: lint

      - name: ruff
        run: uv run --locked --only-group dev ruff check --output-format github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test

      - run: uv sync --locked

      - name: Install headless Chromium and the fonts
        run: |
          uv run playwright install --with-deps --only-shell chromium
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      # ffmpeg, mermaid.js and the music, which narrate fetches or makes on first use
      - name: Cache narrate's downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/narrate-tools
          key: narrate-tools-${{ runner.os }}-${{ hashFiles('src/narrate/media.py', 'src/narrate/mermaid.py', 'src/narrate/music.py') }}

      # As the image's test stage: no Kokoro or speech-to-text models, no Narakeet renders, no ElevenLabs
      - name: Run the tests
        env:
          NARRATE_TOOLS: ${{ runner.temp }}/narrate-tools
        run: uv run pytest -q -m "not kokoro and not elevenlabs and not conformance and not stt"

  # The same tests on macOS, set up from source as docs/building.md says: Homebrew's
  # ffmpeg-full, which narrate finds by itself, and the DejaVu fonts. macos-latest is arm64.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-suffix: test-macos

      # Bottles, so nothing compiles
      - name: Install ffmpeg-full and the fonts
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install ffmpeg-full
          brew install --cask font-dejavu

      - run: uv sync --locked

      # The browsers' versions come with Playwright's, in uv.lock
      - name: Cache headless Chromium and WebKit
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      # macOS has the libraries both need: no --with-deps. WebKit, Safari's engine, runs the
      # studio's scrub test (#114); Linux would need GStreamer and more for it, so only macOS has it.
      - name: Install headless Chromium and WebKit
        run: uv run playwright install --only-shell chromium webkit

      # mermaid.js and the music; ffmpeg is Homebrew's
      - name: Cache narrate's downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/narrate-tools
          key: narrate-tools-${{ runner.os }}-${{ hashFiles('src/narrate/media.py', 'src/narrate/mermaid.py', 'src/narrate/music.py') }}

      - name: Run the tests
        env:
          NARRATE_TOOLS: ${{ runner.temp }}/narrate-tools
        run: uv run pytest -q -m "not kokoro and not elevenlabs and not conformance and not stt"
